<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设施运维与合同履约工作台</title>
<style>
/* IBM Carbon-inspired maintenance console — flat, square, dense. */
:root {
  --primary: #0f62fe;
  --primary-hover: #0050e6;
  --primary-pressed: #002d9c;
  --ink: #161616;
  --ink-muted: #525252;
  --ink-subtle: #8c8c8c;
  --canvas: #ffffff;
  --surface-1: #f4f4f4;
  --surface-2: #e0e0e0;
  --inverse-canvas: #161616;
  --inverse-surface-1: #262626;
  --inverse-ink: #ffffff;
  --inverse-ink-muted: #c6c6c6;
  --hairline: #e0e0e0;
  --hairline-strong: #161616;
  --success: #24a148;
  --warning: #f1c21b;
  --error: #da1e28;
  --info: #0f62fe;
}

/* 主题：默认浅色（侧栏也浅色），切深色时恢复原深色侧栏 */
:root {
  --inverse-canvas: #ffffff;
  --inverse-surface-1: #f0f0f2;
  --inverse-ink: #161616;
  --inverse-ink-muted: #525252;
}
html[data-theme="dark"] {
  --inverse-canvas: #161616;
  --inverse-surface-1: #262626;
  --inverse-ink: #ffffff;
  --inverse-ink-muted: #c6c6c6;
}
/* 待办天数文字色：浅底深琥珀、深底亮黄，两种主题都看得清 */
.alert-days.tone-warn { color: #8a6100; }
.alert-days.tone-red { color: #c41e26; }
html[data-theme="dark"] .alert-days.tone-warn { color: #f1c21b; }
html[data-theme="dark"] .alert-days.tone-red { color: #ff8a8a; }

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  font-size: 14px;
  font-weight: 400;
  line-height: 1.5;
  letter-spacing: .16px;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font-family: inherit; letter-spacing: inherit; }
button { cursor: pointer; }

/* ---------- shell ---------- */
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: 240px;
  padding: 20px 0 16px;
  background: var(--inverse-canvas);
  color: var(--inverse-ink);
  border-right: 1px solid var(--hairline);
  display: flex;
  flex-direction: column;
  z-index: 10;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 16px 26px; }
.brand-mark {
  width: 32px; height: 32px; border-radius: 7px;
  background: var(--primary); color: #fff;
  display: grid; place-items: center; font-size: 20px; line-height: 1;
}
.brand-mark svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.brand-title { font-size: 14px; font-weight: 600; }
.brand-sub { font-size: 11px; color: var(--inverse-ink-muted); letter-spacing: .32px; margin-top: 2px; }

.nav { display: flex; flex-direction: column; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  height: 40px; padding: 0 13px 0 12px;
  border: 0; border-left: 3px solid transparent; border-radius: 0;
  background: transparent; color: var(--inverse-ink-muted);
  font-size: 14px; text-align: left;
  transition: background .2s ease, color .2s ease;
}
.nav-item svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.nav-item:hover { background: var(--inverse-surface-1); color: var(--inverse-ink); }
.nav-item.active { background: var(--inverse-surface-1); color: var(--inverse-ink); border-left-color: var(--primary); font-weight: 600; }

.sidebar-foot { margin-top: auto; padding: 14px 16px 0; border-top: 1px solid var(--inverse-surface-1); display: flex; align-items: center; gap: 9px; }
.foot-dot { width: 8px; height: 8px; border-radius: 0; background: var(--success); }
.foot-label { font-size: 11px; color: var(--inverse-ink-muted); letter-spacing: .32px; }
.foot-value { font-size: 12px; color: var(--inverse-ink); margin-top: 2px; }


.main { margin-left: 240px; min-height: 100vh; padding: 0 32px 64px; }
.utility-bar {
  height: 32px; margin: 0 -32px 24px; padding: 0 32px;
  background: var(--surface-1); border-bottom: 1px solid var(--hairline);
  color: var(--ink-muted); font-size: 12px; letter-spacing: .32px;
  display: flex; align-items: center; justify-content: space-between;
}
.content { max-width: 1280px; margin: 0 auto; }

.topbar {
  max-width: 1280px; margin: 0 auto 24px; padding-bottom: 18px;
  border-bottom: 1px solid var(--hairline);
  display: flex; align-items: flex-end; justify-content: space-between; gap: 20px;
}
.topbar h1 { margin: 0; font-size: 32px; font-weight: 400; line-height: 1.25; letter-spacing: 0; }
.topbar p { margin: 4px 0 0; font-size: 14px; color: var(--ink-muted); }
.top-actions { display: flex; gap: 8px; align-items: center; }

.icon-btn {
  width: 36px; height: 36px; border-radius: 0;
  border: 1px solid var(--hairline); background: var(--canvas); color: var(--ink-muted);
  display: grid; place-items: center; transition: background .2s ease, color .2s ease;
}
.icon-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn:hover { background: var(--surface-1); color: var(--ink); }

.primary-btn {
  border: 0; border-radius: 0; background: var(--primary); color: #fff;
  padding: 10px 16px; min-height: 36px; font-size: 14px; font-weight: 400;
  transition: background .2s ease;
}
.primary-btn:hover { background: var(--primary-hover); }
.primary-btn:active { background: var(--primary-pressed); }
.hidden { display: none !important; }

/* ---------- cards & KPI ---------- */
.card { background: var(--canvas); border: 1px solid var(--hairline); border-radius: 0; padding: 20px 24px; }
.card h2 { margin: 0 0 16px; font-size: 16px; font-weight: 600; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
.card-head h2 { margin: 0; }
.card-head span { font-size: 12px; color: var(--ink-subtle); letter-spacing: .32px; }

.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.kpi { padding: 18px 20px; }
.kpi-label { font-size: 12px; color: var(--ink-muted); letter-spacing: .32px; display: flex; align-items: center; gap: 7px; }
.kpi-label i { width: 8px; height: 8px; border-radius: 0; display: inline-block; }
.kpi-ic { width: 26px; height: 26px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.kpi-ic svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.kpi-value { font-size: 40px; font-weight: 300; letter-spacing: 0; line-height: 1.2; margin-top: 8px; }
.kpi-note { font-size: 12px; color: var(--ink-subtle); margin-top: 6px; }

.chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
.donut-wrap { display: flex; align-items: center; gap: 24px; }
.donut-wrap svg { width: 164px; height: 164px; flex: none; }
.donut-center { font-size: 26px; font-weight: 300; fill: var(--ink); letter-spacing: 0; }
.donut-caption { font-size: 10px; fill: var(--ink-subtle); }
.legend { display: flex; flex-direction: column; gap: 10px; flex: 1; min-width: 0; }
.legend-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-muted); }
.legend-row .swatch { width: 10px; height: 10px; border-radius: 0; flex: none; }
.legend-row .legend-value { margin-left: auto; font-weight: 600; color: var(--ink); }
.bar-chart { width: 100%; height: 196px; display: block; }
.bar-chart text { fill: var(--ink-subtle); font-size: 11px; font-family: inherit; letter-spacing: .16px; }

.progress-item + .progress-item { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--hairline); }
.progress-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.progress-name { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.progress-pct { font-size: 13px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.progress-meta { font-size: 12px; color: var(--ink-subtle); margin-top: 3px; }
.track { height: 8px; border-radius: 0; background: var(--surface-1); border: 1px solid var(--hairline); overflow: hidden; margin-top: 9px; }
.track > div { height: 100%; border-radius: 0; transition: width .35s ease; }

.alert-row { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; }
.alert-row + .alert-row { border-top: 1px solid var(--hairline); }
.alert-dot { width: 8px; height: 8px; border-radius: 0; margin-top: 5px; flex: none; }
.alert-body { min-width: 0; }
.alert-title { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.alert-meta { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }
.alert-days { margin-left: auto; font-size: 12px; font-weight: 600; white-space: nowrap; padding-top: 2px; }

/* ---------- toolbar & tables ---------- */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--hairline); }
.chip { border: 0; border-right: 1px solid var(--hairline); border-radius: 0; background: var(--canvas); color: var(--ink-muted); padding: 8px 13px; font-size: 13px; transition: background .2s ease, color .2s ease; }
.chip:last-child { border-right: 0; }
.chip:hover { background: var(--surface-1); }
.chip.active { background: var(--ink); color: #fff; font-weight: 600; }
.search { margin-left: auto; }
.search input { width: 230px; height: 36px; border-radius: 0; border: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline); background: var(--surface-1); padding: 0 12px; font-size: 13px; color: var(--ink); outline: none; transition: border-color .2s ease; }
.search input:focus { border-bottom: 2px solid var(--primary); }

.table-card { padding: 0; overflow: hidden; }
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 400; letter-spacing: .32px; color: var(--ink-muted); background: var(--surface-1); padding: 11px 9px; white-space: nowrap; }
td { padding: 12px 9px; font-size: 14px; border-top: 1px solid var(--hairline); white-space: nowrap; }
tbody tr { transition: background .2s ease; }
tbody tr:hover { background: var(--surface-1); }
.cell-title { font-weight: 600; }
.cell-sub { font-size: 12px; color: var(--ink-subtle); margin-top: 2px; }
.pill { display: inline-flex; align-items: center; border-radius: 2px; padding: 3px 8px; font-size: 11.5px; font-weight: 600; letter-spacing: .16px; }
.row-actions { display: flex; gap: 4px; }
.text-btn { border: 0; border-radius: 0; background: transparent; color: var(--primary); font-size: 13px; padding: 4px 6px; }
.text-btn:hover { background: var(--surface-1); text-decoration: underline; }
.text-btn.danger { color: var(--error); }
.text-btn.danger:hover { background: #fff1f1; }
.mini-track { width: 88px; height: 6px; border-radius: 0; background: var(--surface-1); overflow: hidden; margin-top: 6px; }
.mini-track > div { height: 100%; border-radius: 0; }

/* ---------- suppliers ---------- */
.supplier-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.supplier-card { padding: 18px 20px; }
.supplier-head { display: flex; gap: 12px; align-items: center; }
.avatar { width: 40px; height: 40px; border-radius: 0; display: grid; place-items: center; font-size: 16px; font-weight: 600; flex: none; }
.supplier-name { font-size: 15px; font-weight: 600; }
.supplier-type { font-size: 12px; color: var(--ink-subtle); margin-top: 2px; }
.supplier-info { margin-top: 14px; display: grid; gap: 6px; font-size: 13px; }
.supplier-info div { display: flex; justify-content: space-between; gap: 10px; }
.supplier-info span { color: var(--ink-subtle); }
.supplier-info b { font-weight: 400; }
.supplier-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--hairline); }

.summary-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 16px; }
.summary-cell { padding: 16px 20px; }
.summary-label { font-size: 12px; color: var(--ink-muted); letter-spacing: .32px; }
.summary-value { font-size: 28px; font-weight: 300; letter-spacing: 0; margin-top: 6px; }

.empty { text-align: center; color: var(--ink-subtle); padding: 48px 20px; font-size: 13px; }
.loading { text-align: center; color: var(--ink-subtle); padding: 72px 0; font-size: 13px; }

/* ---------- modal ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(22, 22, 22, .48); display: grid; place-items: center; padding: 16px; }
.modal { width: min(580px, 100%); max-height: 88vh; overflow-y: auto; background: var(--canvas); border: 1px solid var(--hairline-strong); border-radius: 0; padding: 24px 28px; }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.modal-head h3 { margin: 0; font-size: 20px; font-weight: 400; letter-spacing: 0; }
.close-btn { border: 0; border-radius: 0; background: var(--surface-1); color: var(--ink); width: 30px; height: 30px; font-size: 17px; line-height: 1; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.field label { display: block; font-size: 12px; color: var(--ink-muted); letter-spacing: .32px; margin-bottom: 5px; }
.field label em { color: var(--error); font-style: normal; margin-left: 3px; }
.field input, .field select, .field textarea {
  width: 100%; border: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline-strong);
  border-radius: 0; background: var(--surface-1); padding: 0 12px; height: 38px;
  font-size: 14px; color: var(--ink); outline: none;
  transition: border-color .2s ease;
}
.field textarea { height: 72px; padding: 9px 12px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { border-bottom: 2px solid var(--primary); }
.field.full { grid-column: 1 / -1; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
.ghost-btn { border: 1px solid var(--hairline-strong); border-radius: 0; background: var(--canvas); color: var(--ink); padding: 10px 16px; font-size: 14px; }
.ghost-btn:hover { background: var(--surface-1); }

.toast { position: fixed; bottom: 28px; left: 50%; transform: translate(-50%, 12px); z-index: 80; background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 0; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 1080px) {
  .supplier-grid { grid-template-columns: repeat(2, 1fr); }
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 900px) {
  .sidebar { position: static; width: 100%; height: auto; flex-direction: column; align-items: stretch; padding: 8px 12px 6px; border-bottom: 1px solid var(--inverse-surface-1); gap: 6px; }
  .brand { padding: 0 0 4px; }
  .brand-mark { width: 26px; height: 26px; font-size: 16px; }
  .brand-sub, .sidebar-foot { display: none; }
  .nav { flex-direction: row; flex-wrap: wrap; gap: 2px; }
  .nav-item { flex: 1 1 30%; height: 36px; justify-content: center; padding: 0 6px; font-size: 13px; white-space: nowrap; }
  .nav-item svg { width: 16px; height: 16px; }
  .main { margin-left: 0; padding: 0 16px 48px; }
  .utility-bar { margin: 0 -16px 20px; padding: 0 16px; }
  .chart-grid, .summary-strip { grid-template-columns: 1fr; }
}
@media (max-width: 620px) {
  .supplier-grid, .form-grid { grid-template-columns: 1fr; }
  .search { margin-left: 0; width: 100%; }
  .search input { width: 100%; }
  .donut-wrap { flex-direction: column; align-items: flex-start; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

.reset-link { border:0; background:transparent; color:var(--primary); font-size:12px; padding:0 0 0 10px; text-decoration:underline; cursor:pointer; letter-spacing:inherit; }
.reset-link:hover { color:var(--primary-hover); }
/* 可拖拉表格框：框内滚动 + 底部拖拉条 */
.rs-box{position:relative;overflow:auto;height:380px;min-height:180px;max-height:900px;overscroll-behavior:contain}
.rs-bar{height:14px;cursor:ns-resize;display:flex;align-items:center;justify-content:center;margin-top:3px;user-select:none;border-top:1px solid rgba(127,127,127,.22)}
.rs-bar span{width:38px;height:3px;border-radius:2px;background:rgba(127,127,127,.35)}
.rs-bar:hover span{background:rgba(127,127,127,.6)}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="brand">
    <div class="brand-mark"><svg viewBox="0 0 24 24"><path d="M4 21V7l8-4 8 4v14"/><path d="M2 21h20M9 21v-5h6v5"/></svg></div>
    <div>
      <div class="brand-title">设施运维工作台</div>
      <div class="brand-sub">Digital Twin CMMS</div>
    </div>
  </div>

  <nav class="nav" aria-label="主导航">
    <button class="nav-item active" data-route="overview">
      <svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1v-9.5Z"/></svg>
      <span>总览</span>
    </button>
    <button class="nav-item" data-route="equipment">
      <svg viewBox="0 0 24 24"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/></svg>
      <span>设施设备</span>
    </button>
    <button class="nav-item" data-route="work_orders">
      <svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.8-.7-.7-2.8 2.8-2.8Z"/></svg>
      <span>运维工单</span>
    </button>
    <button class="nav-item" data-route="suppliers">
      <svg viewBox="0 0 24 24"><path d="M4 21V6l8-3 8 3v15"/><path d="M9 21v-5h6v5"/></svg>
      <span>供委单位</span>
    </button>
    <button class="nav-item" data-route="contracts">
      <svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6V3Z"/><path d="M14 3v5h5M9 12h7M9 16h7"/></svg>
      <span>合同管理</span>
    </button>
    <button class="nav-item" data-route="milestones">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg>
      <span>履约进度</span>
    </button>
  </nav>

  <div class="sidebar-foot">
    <div class="foot-dot"></div>
    <div>
      <div class="foot-label">界面示例数据</div>
      <div class="foot-value" id="data-date">—</div>
    </div>
  </div>
</aside>

<main class="main">
  <div class="utility-bar"><span>设施运维 / 合同履约工作台</span><span>CMMS · 界面示例数据<button class="reset-link" id="reset-btn">重置示例</button></span></div>
  <header class="topbar">
    <div>
      <h1 id="page-title">总览</h1>
      <p id="page-sub">设施设备与合同履约全景</p>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="themeBtn" title="切换深色/浅色" aria-label="切换深色浅色">
        <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="icon-btn" id="refresh-btn" title="刷新数据" aria-label="刷新数据">
        <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg>
      </button>
      <button class="primary-btn hidden" id="add-btn"><span>+</span> <span id="add-label">新增</span></button>
    </div>
  </header>

  <div class="content" id="view">
    <div class="loading">加载中…</div>
  </div>
</main>

<div id="modal-root"></div>
<div id="toast" class="toast"></div>
<script>
/* 主题切换：默认浅色，记忆选择 */
(function(){
  var ICON_MOON='<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  var ICON_SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  function applyTheme(t){
    if(t==='dark') document.documentElement.setAttribute('data-theme','dark');
    else document.documentElement.removeAttribute('data-theme');
    var btn=document.getElementById('themeBtn');
    if(btn) btn.innerHTML=(t==='dark'?ICON_SUN:ICON_MOON);
    try{ localStorage.setItem('facilityapp-theme',t); }catch(e){}
  }
  var initT='light'; try{ initT=localStorage.getItem('facilityapp-theme')||'light'; }catch(e){}
  applyTheme(initT);
  var btn=document.getElementById('themeBtn');
  if(btn) btn.onclick=function(){
    var now=document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';
    applyTheme(now==='dark'?'light':'dark');
  };
})();

function nextCode(key){
  const nextId = store[key].reduce((m,r) => Math.max(m, r.id || 0), 0) + 1;
  const year = new Date().getFullYear();
  if (key === 'contracts') return `CT-${year}-${String(nextId).padStart(3,'0')}`;
  if (key === 'work_orders') return `WO-${String(nextId).padStart(4,'0')}`;
  return `${CODE_PREFIX[key]}-${String(nextId).padStart(3,'0')}`;
}
function sanitize(key, payload){
  const clean = {};
  Object.keys(payload || {}).forEach((f) => {
    let v = payload[f];
    if (typeof v === 'string') { v = v.trim(); if (v === '') v = null; }
    if (INT_FIELDS.includes(f) && v != null) v = parseInt(v, 10);
    if (FLOAT_FIELDS.includes(f) && v != null) v = parseFloat(v);
    clean[f] = v;
  });
  return clean;
}

function daysUntil(value, today){
  if (!value) return null;
  return Math.round((new Date(value + 'T00:00:00') - new Date(today + 'T00:00:00')) / 86400000);
}
function monthKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function countBy(rows, field, order){
  const m = {}; rows.forEach((r) => { m[r[field]] = (m[r[field]]||0)+1; });
  const out = {}; order.forEach((k) => { out[k] = m[k]||0; }); return out;
}

  const months = [];
  const cur = new Date(new Date(today + 'T00:00:00').getFullYear(), new Date(today + 'T00:00:00').getMonth(), 1);
  for (let i=0;i<6;i++){ months.push(monthKey(cur)); cur.setMonth(cur.getMonth()-1); }
  months.reverse();
  const mcount = {}; work_orders.forEach((w) => { const k = (w.created_date||'').slice(0,7); mcount[k] = (mcount[k]||0)+1; });

  const contract_progress = contracts.slice().sort((a,b)=>b.id-a.id).map((c) => {
    const ms = milestones.filter((m) => m.contract_id === c.id);
    const sum = ms.reduce((s,m) => s + (m.progress||0), 0);
    return {
      id:c.id, code:c.code, name:c.name, amount:c.amount, end_date:c.end_date, status:c.status,
      supplier_name: (suppliers.find((s) => s.id === c.supplier_id)||{}).name || '',
      progress: ms.length ? Math.round(sum/ms.length) : null,
      milestone_total: ms.length, milestone_done: ms.filter((m) => m.status === '已完成').length,
    };
  });

  const ratings = suppliers.map((s) => s.rating).filter((r) => r != null);
  const overdue_ms = milestones.filter((m) => m.status === '逾期');
  const cnames = {}; contracts.forEach((c) => { cnames[c.id] = c.name; });
  const overdue_list = overdue_ms.map((m) => ({ id:m.id, title:m.title, plan_date:m.plan_date, contract_name: cnames[m.contract_id]||'' }));

  return {
    today,
    equipment: {
      total: equipment.length, by_status: countBy(equipment,'status',EQUIPMENT_STATUS),
      by_category: (()=>{ const m={}; equipment.forEach((e)=>{m[e.category]=(m[e.category]||0)+1;}); return m; })(),
      attention: equipment.filter((e) => ['报修','维保中'].includes(e.status)).length,
      maintenance_alerts,
    },
    work_orders: {
      total: work_orders.length, open: active_orders.length,
      by_status: countBy(work_orders,'status',WO_STATUS),
      by_priority: countBy(work_orders,'priority',['高','中','低']),
      overdue: overdue_orders.length,
      monthly: months.map((m) => ({ month:m, count:mcount[m]||0 })),
    },
    suppliers: {
      total: suppliers.length, active: suppliers.filter((s) => s.status === '合作中').length,
      avg_rating: ratings.length ? Math.round(ratings.reduce((a,b)=>a+b,0)/ratings.length*10)/10 : 0,
    },
    contracts: {
      total: contracts.length, active: contracts.filter((c) => c.status === '执行中').length,
      total_amount: contracts.reduce((s,c) => s + (c.amount||0), 0),
      by_status: countBy(contracts,'status',CONTRACT_STATUS),
      expiring: expiring.length, expiring_list, progress: contract_progress,
    },
    milestones: {
      total: milestones.length, by_status: countBy(milestones,'status',MILESTONE_STATUS),
      overdue: overdue_ms.length, overdue_list,
      overall_progress: milestones.length ? Math.round(milestones.reduce((s,m)=>s+(m.progress||0),0)/milestones.length) : 0,
    },
  };
}

async function api(path, options = {}) {
  const method = (options.method || 'GET').toUpperCase();
  const body = options.body ? JSON.parse(options.body) : null;
  const parts = path.replace(/^\//,'').split('/');
  const resource = parts[0];
  const id = parts[1] ? Number(parts[1]) : null;

  if (resource === 'dashboard') return computeDashboard();
  if (!store[resource]) throw new Error('未知数据类别');

  if (method === 'GET' && id == null) return store[resource].slice().sort((a,b) => b.id - a.id);
  if (method === 'GET' && id != null) return store[resource].find((r) => r.id === id);

  if (method === 'POST') {
    const clean = sanitize(resource, body || {});
    const missing = (REQUIRED[resource]||[]).filter((f) => clean[f] == null || clean[f] === '');
    if (missing.length) throw new Error('缺少必填项：' + missing.join('、'));
    if (resource === 'work_orders' && !clean.created_date) clean.created_date = new Date().toISOString().slice(0,10);
    if (CODE_PREFIX[resource] && !clean.code) clean.code = nextCode(resource);
    const nextId = store[resource].reduce((m,r) => Math.max(m, r.id||0), 0) + 1;
    const row = Object.assign({ id: nextId }, clean);
    store[resource].push(row); persist();
    return row;
  }
  if (method === 'PUT') {
    const row = store[resource].find((r) => r.id === id);
    if (!row) throw new Error('记录不存在');
    Object.assign(row, sanitize(resource, body || {})); persist();
    return row;
  }
  if (method === 'DELETE') {
    const idx = store[resource].findIndex((r) => r.id === id);
    if (idx < 0) throw new Error('记录不存在');
    store[resource].splice(idx, 1);
    if (resource === 'contracts') store.milestones = store.milestones.filter((m) => m.contract_id !== id);
    persist();
    return { deleted: true };
  }
  throw new Error('未知操作');
}

function toast(message) {

  el.textContent = message;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

async function renderRoute() {
  const route = (location.hash.replace(/^#\/?/, '') || 'overview').split('?')[0];
  state.route = ROUTES[route] ? route : 'overview';
  const meta = ROUTES[state.route];

  document.querySelectorAll('.nav-item').forEach((btn) => btn.classList.toggle('active', btn.dataset.route === state.route));

  document.getElementById('add-label').textContent = meta.add || '';

  }
}

function donutChart(items, colors, caption) {
  const total = items.reduce((sum, item) => sum + item.value, 0);
  if (!total) return '<div class="empty">暂无数据</div>';
  const radius = 62;
  const circumference = 2 * Math.PI * radius;
  let offset = 0;
  const circles = items.map((item, i) => {
    const length = circumference * item.value / total;
    const circle = `<circle cx="84" cy="84" r="${radius}" fill="none" stroke="${colors[i % colors.length]}" stroke-width="18" stroke-dasharray="${Math.max(length - 2, 0)} ${circumference - Math.max(length - 2, 0)}" stroke-dashoffset="${-offset}" transform="rotate(-90 84 84)"></circle>`;
    offset += length;
    return circle;
  }).join('');
  const legend = items.map((item, i) => `<div class="legend-row"><i class="swatch" style="background:${colors[i % colors.length]}"></i><span>${esc(item.label)}</span><span class="legend-value">${item.value}</span></div>`).join('');
  return `<div class="donut-wrap"><svg viewBox="0 0 168 168" role="img" aria-label="${esc(caption)}分布">${circles}<text x="84" y="81" text-anchor="middle" class="donut-center">${total}</text><text x="84" y="100" text-anchor="middle" class="donut-caption">${esc(caption)}</text></svg><div class="legend">${legend}</div></div>`;
}

function barChart(items) {
  const max = Math.max(1, ...items.map((item) => item.count));
  const bars = items.map((item, i) => {
    const height = item.count / max * 116;
    const x = 32 + i * 94;
    const fill = i === items.length - 1 ? COLORS.blue : '#A6C8FF';
    return `<rect x="${x}" y="${150 - height}" width="46" height="${height}" rx="0" fill="${fill}"></rect><text x="${x + 23}" y="${143 - height}" text-anchor="middle">${item.count}</text><text x="${x + 23}" y="173" text-anchor="middle">${esc(item.month.slice(5))}月</text>`;
  }).join('');
  return `<svg class="bar-chart" viewBox="0 0 600 190" role="img" aria-label="近六个月工单量"><line x1="22" y1="151" x2="578" y2="151" stroke="#E8E8ED"/>${bars}</svg>`;
}

function fieldHTML(field, item) {
  const value = item ? (item[field.key] ?? '') : '';
  const required = field.required ? '<em>*</em>' : '';
  const label = `<label>${esc(field.label)}${required}</label>`;
  const wrapper = (content) => `<div class="field ${field.full ? 'full' : ''}">${label}${content}</div>`;
  if (field.type === 'select') {
    const options = field.optionsFrom
      ? (state.cache[field.optionsFrom] || []).map((x) => `<option value="${x.id}" ${String(value) === String(x.id) ? 'selected' : ''}>${esc(x.name)}</option>`).join('')
      : (field.options || []).map((x) => `<option value="${esc(x)}" ${String(value) === x ? 'selected' : ''}>${esc(x)}</option>`).join('');
    const placeholder = field.optionsFrom ? '<option value="">请选择</option>' : '';
    return wrapper(`<select name="${field.key}">${placeholder}${options}</select>`);
  }
  if (field.type === 'textarea') {
    return wrapper(`<textarea name="${field.key}" placeholder="${esc(field.placeholder || '')}">${esc(value)}</textarea>`);
  }
  return wrapper(`<input name="${field.key}" type="${field.type || 'text'}" value="${esc(value)}" placeholder="${esc(field.placeholder || '')}" ${field.type === 'number' ? 'step="any"' : ''}>`);
}

  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="overlay"><form class="modal" id="record-form">
    <div class="modal-head"><h3>${item ? '编辑' : '新增'}${esc(NOUNS[route])}</h3><button type="button" class="close-btn" id="close-modal">×</button></div>
    <div class="form-grid">${fields}</div>
    <div class="modal-foot"><button type="button" class="ghost-btn" id="cancel-modal">取消</button><button type="submit" class="primary-btn">保存</button></div>
  </form></div>`;

  document.getElementById('close-modal').addEventListener('click', closeModal);
  document.getElementById('cancel-modal').addEventListener('click', closeModal);
  root.querySelector('.overlay').addEventListener('click', (event) => { if (event.target.classList.contains('overlay')) closeModal(); });
  document.addEventListener('keydown', onModalKey);

  document.getElementById('record-form').addEventListener('submit', async (event) => {
    event.preventDefault();
    const form = event.currentTarget;
    const payload = {};
    FIELDS[route].forEach((field) => { payload[field.key] = form.elements[field.key]?.value ?? ''; });
    try {
      await api(id ? `/${route}/${id}` : `/${route}`, { method: id ? 'PUT' : 'POST', body: JSON.stringify(payload) });
      closeModal();
      toast('已保存');
      await loadCache();
      await renderRoute();
    } catch (err) {
      toast('保存失败：' + err.message);
    }
  });
}

async function removeRecord(route, id) {
  if (!window.confirm('确认删除这条记录？删除后无法恢复。')) return;
  try {
    await api(`/${route}/${id}`, { method: 'DELETE' });
    toast('已删除');
    await loadCache();
    await renderRoute();
  } catch (err) {
    toast('删除失败：' + err.message);
  }
}

view.addEventListener('click', (event) => {
  const chip = event.target.closest('[data-filter]');
  if (chip) {
    state.filters[state.route] = chip.dataset.filter;
    view.querySelectorAll('.chip').forEach((c) => c.classList.toggle('active', c === chip));
    renderRows(state.route);
    return;
  }
  const button = event.target.closest('[data-action]');
  if (button) {
    if (button.dataset.action === 'edit') openModal(state.route, button.dataset.id);
    if (button.dataset.action === 'delete') removeRecord(state.route, button.dataset.id);
  }
});
view.addEventListener('input', (event) => {
  if (event.target.id === 'table-search') renderRows(state.route);
});

function navigate(route) {
  const hash = '#/' + route;
  if (location.hash !== hash) history.pushState(null, '', hash);
  // 切换模块时回到顶部，避免沿用上一个模块的滚动位置导致标题被裁切
  window.scrollTo(0, 0);
  renderRoute();
}
document.querySelectorAll('.nav-item').forEach((btn) => btn.addEventListener('click', () => navigate(btn.dataset.route)));
window.addEventListener('popstate', renderRoute);
window.addEventListener('hashchange', renderRoute);
document.getElementById('refresh-btn').addEventListener('click', renderRoute);
document.getElementById('add-btn').addEventListener('click', () => openModal(state.route));

document.getElementById('reset-btn').addEventListener('click', () => {
  if (!window.confirm('重置为内置示例数据？当前页面的所有改动将被清除。')) return;
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  location.reload();
});
loadCache().then(renderRoute).catch((err) => {
  view.innerHTML = `<div class="empty">初始化失败：${esc(err.message)}</div>`;
});

</script>


<script>
/* 表格框内滚动 + 底部拖拉调高，高度记在本机 */
(function(){
  var sels = ['.table-scroll'], storeKey = 'rs-h-facility', DEF = 380, MIN = 180, MAX = 900;
  function bgOf(el){
    var e = el, c;
    while(e && e.nodeType === 1){
      c = getComputedStyle(e).backgroundColor;
      if(c && c !== 'rgba(0, 0, 0, 0)' && c !== 'transparent') return c;
      e = e.parentElement;
    }
    return '#fff';
  }
  function wrap(el){
    if(!el || el.__rsDone) return;
    el.__rsDone = true;
    el.classList.add('rs-box');
    var saved = null;
    try{ saved = localStorage.getItem(storeKey); }catch(e){}
    el.style.height = (saved && parseInt(saved,10) > 0) ? saved : DEF + 'px';
    var ths = el.querySelectorAll('thead th');
    for(var i = 0; i < ths.length; i++){
      ths[i].style.background = bgOf(ths[i]);
      ths[i].style.position = 'sticky';
      ths[i].style.top = '0';
      ths[i].style.zIndex = '2';
    }
    var bar = document.createElement('div');
    bar.className = 'rs-bar';
    bar.title = '拖动调整表格高度';
    bar.innerHTML = '<span></span>';
    el.parentNode.insertBefore(bar, el.nextSibling);
    bar.addEventListener('mousedown', function(e){
      e.preventDefault();
      var y0 = e.clientY, h0 = el.getBoundingClientRect().height;
      document.body.style.userSelect = 'none';
      function mv(ev){
        var h = Math.max(MIN, Math.min(MAX, h0 + ev.clientY - y0));
        el.style.height = h + 'px';
      }
      function up(){
        document.removeEventListener('mousemove', mv);
        document.removeEventListener('mouseup', up);
        document.body.style.userSelect = '';
        try{ localStorage.setItem(storeKey, el.style.height); }catch(e){}
      }
      document.addEventListener('mousemove', mv);
      document.addEventListener('mouseup', up);
    });
  }
  function scan(){
    var bars = document.querySelectorAll('.rs-bar');
    for(var i = 0; i < bars.length; i++){
      var p = bars[i].previousElementSibling;
      if(!p || !p.classList.contains('rs-box')) bars[i].parentNode.removeChild(bars[i]);
    }
    for(var j = 0; j < sels.length; j++){
      var els = document.querySelectorAll(sels[j]);
      for(var k = 0; k < els.length; k++) wrap(els[k]);
    }
  }
  scan();
  if(window.MutationObserver){
    var mo = new MutationObserver(function(){ scan(); });
    mo.observe(document.body, {childList:true, subtree:true});
  }
})();
</script>
